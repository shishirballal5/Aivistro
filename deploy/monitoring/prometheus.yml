# Minimal Prometheus config for AIVISTRO. The API exposes /api/v1/metrics only when METRICS_TOKEN is set.
global: { scrape_interval: 15s }
rule_files: [alerts.yml]
scrape_configs:
  - job_name: aivistro-api
    metrics_path: /api/v1/metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/aivistro-metrics-token }
    static_configs: [{ targets: ['api:3000'] }]
