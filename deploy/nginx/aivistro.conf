# AIVISTRO production nginx (TLS terminates here). Replace example.com, certificate paths and the upstream address.
# Layout: static website + admin from /var/www/aivistro (the contents of `npm run build` -> dist/), API proxied to the Node process.

upstream aivistro_api { server 127.0.0.1:3000; keepalive 32; }

# Redirect all plain HTTP to HTTPS.
server { listen 80; listen [::]:80; server_name example.com www.example.com; return 301 https://example.com$request_uri; }

server {
  listen 443 ssl; listen [::]:443 ssl; http2 on;
  server_name example.com;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d; ssl_session_cache shared:SSL:10m; ssl_session_tickets off;

  root /var/www/aivistro; index index.html;
  client_max_body_size 6m;                         # images; videos go straight to object storage, never through here
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

  # --- security headers (keep in step with public/_headers) ---
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\")" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://*.razorpay.com https://accounts.google.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # --- API: same origin as the site, so the browser needs no CORS ---
  location /api/ {
    proxy_pass http://aivistro_api;
    proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # set TRUST_PROXY_HOPS=1 in the API
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;                                            # HLS segments and key requests stream through
    # Raw bodies are needed for payment webhook signatures: do not rewrite or compress them here.
  }

  # Prometheus metrics and Swagger must not be public. The API already requires a token / is disabled in production; block them here too.
  location = /api/v1/metrics { allow 10.0.0.0/8; allow 127.0.0.1; deny all; proxy_pass http://aivistro_api; }
  location /api/docs        { return 404; }

  # --- admin portal: ideally a separate hostname behind VPN / IP allow-list. Minimum: restrict by IP here. ---
  location = /admin { # allow 203.0.113.0/24; deny all;
    try_files /admin.html =404; }

  # --- static assets: hashed filenames, cache forever ---
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
  location /media/  { expires 7d; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
